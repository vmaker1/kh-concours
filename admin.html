<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콩쿠르 운영 관리</title>
<link rel="stylesheet" href="style.css">
<style>
  .gtab td, .gtab th { white-space: nowrap; }
  .tb-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .tb-tools input, .tb-tools select { width: auto; min-width: 140px; }
  td.ed { cursor: pointer; }
  td.ed:hover { outline: 2px solid var(--accent-soft); }
  td.miss { background: var(--warn-soft); }
  .judge-c { text-align: center; min-width: 38px; }
  .flagrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .flagrow:last-child { border-bottom: 0; }
  .flagrow b { flex: 1; font-weight: 600; }
  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: #cfc6ca; border-radius: 99px; transition: .15s; }
  .switch span::after { content: ''; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { left: 25px; }
  .mapgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
  .mapgrid label { font-size: 13px; color: var(--sub); font-weight: 700; }
  .mapgrid select { min-height: 38px; padding: 6px 8px; font-size: 14px; }
  .mlist { max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  .ntv { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 6px; font-size: 15px; line-height: 1.7; max-height: 60vh; overflow: auto; background: #fff; }
  .ntv p { margin: 0; } .ntv table { width: auto; margin: 6px 0; } .ntv td, .ntv th { border: 1px solid #999; padding: 4px 10px; }
  .kpi .kd { display: block; color: var(--sub); font-size: 12.5px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi.warnk { background: var(--warn-soft); }
  .dtab tr.sub td { background: var(--panel); color: var(--sub); }
  /* 부문 × 구분 피벗 (올해 | 전년) */
  .pv th, .pv td { text-align: right; font-variant-numeric: tabular-nums; }
  .pv th.h, .pv td:first-child { text-align: left; }
  .pv thead tr:not(.yr) th { text-align: right; }
  .pv thead tr th.h { text-align: left; }
  .pv thead tr.yr th { text-align: center; font-size: 14px; color: var(--ink); background: var(--accent-soft); }
  .pv thead tr.yr th.pr { background: var(--panel); color: var(--sub); }
  .pv thead tr.yr th small { font-weight: 500; color: var(--sub); margin-left: 4px; }
  .pv td.t, .pv th.t { font-weight: 800; background: var(--panel); }
  .pv .b { border-left: 2px solid var(--line); }
  .pv td.p { color: var(--sub); }
  .pv tr.gs td { font-size: 12.5px; color: var(--sub); padding-top: 2px; padding-bottom: 2px; }
  .pv tr.hl td { font-weight: 800; border-top: 2px solid var(--line); }
  .pv .up { color: var(--ok); } .pv .dn { color: var(--bad); }
  .pv .z { color: var(--line); }
  .linkish { background: none; border: 0; padding: 0; min-height: 0; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font: inherit; }
  .pv th small .up, .pv td small .up { color: var(--ok); } .pv td small .dn { color: var(--bad); }
  .bars { display: grid; gap: 7px; }
  .hb { display: grid; grid-template-columns: 92px 1fr 46px 40px; gap: 8px; align-items: center; font-size: 14px; }
  .hb .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hb .lab em { font-style: normal; font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 3px; }
  .hb .trk { position: relative; height: 14px; background: var(--panel); border-radius: 4px; }
  .hb .trk i { position: absolute; left: 0; top: 0; bottom: 0; background: #b7adb2; border-radius: 0 4px 4px 0; min-width: 2px; }
  .hb.on .trk i { background: var(--accent); }
  .hb .trk u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); margin-left: -1px; }
  .hb b { text-align: right; font-variant-numeric: tabular-nums; }
  .hb small { text-align: right; color: var(--sub); font-variant-numeric: tabular-nums; }
  .att table { width: 100%; table-layout: fixed; font-size: 12pt; }
  .att td { padding: 0 2mm; vertical-align: middle; }
  .att .af { display: flex; justify-content: space-between; margin-top: 3mm; font-size: 11pt; }
  .jsh h1 { font-size: 16pt; margin: 0 0 1.5mm; }
  .jsh .meta { margin-bottom: 2mm; font-size: 10.5pt; }
  .jsh .jn { display: flex; justify-content: space-between; font-size: 11.5pt; margin: 0 0 2.5mm; }
  .jsh .two { display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; }
  .jsh table.ox { width: 100%; border-collapse: collapse; font-size: 10pt; table-layout: fixed; }
  .jsh table.ox th { padding: 1mm; font-size: 8.5pt; line-height: 1.15; }
  .jsh table.ox td { height: 7.5mm; padding: 0 1.2mm; }
  .jsh table.ox td.mk { font-size: 7.5pt; color: #333; white-space: nowrap; overflow: hidden; }
  .jsh .nt { font-size: 8.5pt; margin: 2mm 0 0; }
  .dgrid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
  .dgrid.half { grid-template-columns: 1fr 1fr; }
  .dgrid > .card { margin: 0; }
  @media (max-width: 860px) { .dgrid, .dgrid.half { grid-template-columns: 1fr; } }
  .tw { position: relative; }
  .tw svg { width: 100%; height: auto; display: block; }
  .tw .gl { stroke: var(--line); stroke-width: 1; }
  .tw .ax { font-size: 11px; fill: var(--sub); }
  .tw .lna { fill: none; stroke: var(--accent); stroke-width: 2.25; stroke-linejoin: round; }
  .tw .lnb { fill: none; stroke: #8f878c; stroke-width: 2; stroke-dasharray: 5 4; stroke-linejoin: round; }
  .tw .dl { font-size: 12px; fill: var(--sub); font-variant-numeric: tabular-nums; } .tw .dl.b { fill: var(--ink); font-weight: 700; }
  .tw .xh { stroke: var(--ink); stroke-width: 1; opacity: .35; }
  .tw .ttp { position: absolute; top: 4px; width: 190px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font-size: 12.5px; box-shadow: 0 4px 14px rgba(0,0,0,.08); pointer-events: none; }
  .tlg { display: flex; gap: 14px; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  .tlg i, .ttp i { display: inline-block; width: 16px; height: 0; border-top: 2.5px solid var(--accent); vertical-align: middle; margin-right: 5px; }
  .tlg i.lb, .ttp i.lb { border-top: 2px dashed #8f878c; }
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="store-local.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="app.js"></script>
<script src="timetable.js"></script>
<script src="notices.js"></script>
<script src="forms.js"></script>
<script src="docfill.js"></script>
<script src="crypto.js"></script>
<script src="admin-docs.js"></script>
<script src="judgelist.js"></script>
<script>
{
const { $, $$, esc, api, toast, modal, confirmBox, busy, fmtDate, fmtBirth } = App;
App.demoBar();
const app = $('#app');
const TABS_ALL = [['dash', '현황'], ['people', '참가자'], ['pay', '입금대조'], ['plan', '시간표'], ['sched', '조편성'], ['print', '출석부·인쇄'], ['judges', '심사위원'], ['results', '채점결과'], ['notice', '공지'], ['docs', '문서·출력'], ['staff', '인력·지급'], ['arch', '지난 회차'], ['settings', '설정']];
// 가상계좌(기본)면 입금대조 탭은 숨김 — 설정 payMode=match 로 바꾸면 다시 보임
const TABS_NOW = () => TABS_ALL.filter(t => t[0] !== 'pay' || (D && D.cfg && D.cfg.payMode === 'match'));
let D = null, TAB = (location.hash || '#dash').slice(1), ROUND = 'R1', RES_GROUP = null, PFILTER = { q: '', g: '', pay: '' };
if (!TABS_ALL.some(t => t[0] === TAB)) TAB = 'dash';

const isPaid = p => KC.isPaid(p), isActive = p => KC.isActive(p);
const PT = (p, r) => KC.piecesText(KC.piecesFor(p, r));           // 곡목 한 줄 텍스트
const GL = k => KC.groupLabel(k);
const call = (a, p) => api(a, p, 'admin');
function onErr(e) { if (e.needLogin) needLogin(); else toast(e.message, 'bad'); }
function needLogin() { App.loginView(app, 'admin', '콩쿠르 운영 관리', '관리자 비밀번호를 입력해 주세요.', () => load()); }
const rname = r => r === 'R2' ? (D.cfg.r2Name || '본선') : (D.cfg.r1Name || '예선');

let EPOCH = 0; // 나가기 뒤에 늦게 도착한 응답이 화면을 다시 그리지 않게
// 속도: 받아 둔 자료(D)에 버전을 붙여 두고, 서버 버전이 같으면 다시 받지 않음.
// 시트를 직접 고친 건 버전이 안 바뀌니 10분이 지나면 한 번은 통째로 다시 받음 ('새로고침' 버튼은 언제나 통째로)
let VER = '', FULL_AT = 0, CHECK_AT = 0, TOUCHED = false;
const FRESH_MS = 10 * 60e3;
function fetchD(force) {
  const fresh = D && VER && !force && Date.now() - FULL_AT < FRESH_MS;
  return call('adminLoad', fresh ? { ver: VER } : {}).then(d => {
    CHECK_AT = Date.now();
    if (d.same) return false;
    D = d; VER = d.ver || ''; FULL_AT = Date.now(); return true;
  });
}
function load(force) {
  const ep = EPOCH;
  return fetchD(force).then(() => { if (ep !== EPOCH) return; App.applyTheme(D.cfg.themeColor); document.title = (D.cfg.shortTitle || '콩쿠르') + ' 운영 관리'; shell(); }).catch(onErr);
}
// 메뉴 이동: 받아 둔 자료로 바로 그리고, 뒤에서 바뀐 게 있는지만 확인
let PEEKING = false;
function peek() {
  if (PEEKING || Date.now() - CHECK_AT < 3e3) return;
  const ep = EPOCH, tab = TAB, y = window.scrollY;
  PEEKING = true;
  fetchD(false).finally(() => { PEEKING = false; }).then(changed => {
    if (!changed || ep !== EPOCH || TAB !== tab) return;
    if (!TOUCHED && !document.querySelector('.modal-bg, .modal')) { shell(); window.scrollTo(0, y); }
    else freshBar();
  }).catch(() => { });
}
function freshBar() {
  if ($('#fresh')) return;
  const b = document.createElement('button'); b.id = 'fresh'; b.className = 'pri';
  b.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.18)';
  b.textContent = '다른 곳에서 바뀐 자료가 있어요 · 반영하기';
  b.addEventListener('click', () => { b.remove(); shell(); });
  document.body.appendChild(b);
}
app.addEventListener('input', () => { TOUCHED = true; }, true);
function shell() {
  TOUCHED = false; const fb = $('#fresh'); if (fb) fb.remove();
  app.innerHTML = '<header class="top"><div class="wrap">' + App.brandHTML(KC.brandOf(D.cfg), '운영 관리' + (D.me && D.me.name ? ' · ' + esc(D.me.name) : '')) + '<span class="sp"></span>' +
    '<a class="btn sm" href="index.html" target="_blank" rel="noopener">참가자 조회</a><a class="btn sm" href="desk.html" target="_blank" rel="noopener">현장</a><a class="btn sm" href="judge.html" target="_blank" rel="noopener">심사위원</a><button class="sm" id="rl">새로고침</button><button class="sm" id="lo">나가기</button></div></header>' +
    '<main class="wrap" style="padding-top:8px;padding-bottom:60px"><nav class="tabs" role="tablist">' + TABS_NOW().map(t => '<button data-t="' + t[0] + '" class="' + (t[0] === TAB ? 'on' : '') + '">' + t[1] + '</button>').join('') + '</nav><div id="view"></div></main>';
  $$('[data-t]').forEach(b => b.addEventListener('click', () => { TAB = b.dataset.t; location.hash = TAB; JDRAFT = null; shell(); window.scrollTo(0, 0); peek(); }));
  $('#rl').addEventListener('click', e => {
    const b = e.currentTarget, ep = EPOCH; b.disabled = true; b.textContent = '불러오는 중…';
    fetchD(true).then(() => { if (ep !== EPOCH) return; shell(); toast('최신 데이터로 불러왔어요'); }).catch(err => { b.disabled = false; b.textContent = '새로고침'; onErr(err); });
  });
  $('#lo').addEventListener('click', () => { EPOCH++; D = null; VER = ''; App.setToken('admin', null); needLogin(); });
  ({ dash, people, pay, plan: planTab, sched, print: printTab, judges, results, notice: noticeTab, docs: () => ADMX.docs(), staff: () => ADMX.staff(), arch, settings })[TAB]();
}
const view = () => $('#view');
const refresh = () => load();
// 문서·출력 / 인력·지급 탭(admin-docs.js)에 넘겨 주는 것
window.ADM = { get D() { return D; }, call, load, refresh, view, onErr, rname, GL };

/* ================= 현황 ================= */
// 숫자만 보는 화면. 전년 자료(Config.prevStats)는 전년 신청자 엑셀에서 인원 수만 뽑아 둔 것 — 이름·연락처는 없음
const nf = n => (+n || 0).toLocaleString('ko-KR');
function prevStats() { try { return D.cfg.prevStats ? JSON.parse(D.cfg.prevStats) : null; } catch (e) { return null; } }
// 기준·비교 회차: 'live'(올해, 이 시스템 자료) · 's75'(지난 회차 보관함) · 'prev'(예전 '전년 자료' 한 개)
let DBASE = 'live', DCMP = null;   // DCMP: null = 기준 바로 앞 회차, '' = 비교 안 함
const liveNo = () => +((/(\d+)\s*회/.exec((D && D.cfg.title) || '') || [])[1] || 0);
function seasonOpts() {
  const out = [], ln = liveNo();
  out.push({ id: 'live', no: ln || 9999, live: true, label: (ln ? ln + '회 ' : '') + '올해 (진행 중)' });
  (D.seasons || []).map(z => { let st = null; try { st = JSON.parse(z.stats); } catch (e) { } return st ? { id: 's' + z.no, no: +z.no, label: z.label || (z.no + '회'), st, z } : null; })
    .filter(Boolean).sort((a, b) => b.no - a.no).forEach(x => out.push(x));
  const pv = prevStats(); if (pv) out.push({ id: 'prev', no: -1, label: (pv.label || '전년') + ' (전년 자료)', st: pv });
  return out;
}
// 기준보다 앞선 회차 중 가장 가까운 것 (없으면 예전 '전년 자료')
function defaultCmp(O, B) { const c = O.filter(o => !o.live && o.id !== B.id && o.no < B.no && o.no > 0)[0] || O.find(o => o.id === 'prev' && o.id !== B.id); return c ? c.id : ''; }
function deltaTxt(cur, prev, lab) {
  if (prev == null) return '';
  const d = cur - prev, pc = prev ? Math.round(d / prev * 1000) / 10 : 0;
  return (lab || '전년') + ' ' + nf(prev) + ' · ' + (d > 0 ? '▲' + nf(d) : d < 0 ? '▼' + nf(-d) : '같음') + (prev && d ? ' (' + (d > 0 ? '+' : '') + pc + '%)' : '');
}
const GRADE_ORDER = ['초1', '초2', '초3', '초4', '초5', '초6', '초 졸업', '중1', '중2', '중3', '중 졸업', '고1', '고2', '고3', '고 졸업', '대학·일반1', '대학·일반2', '대학·일반3', '대학·일반4', '대학·일반 졸업', '대학·일반'];
function dash() {
  const cfg = D.cfg, O = seasonOpts();
  let BO = O.find(o => o.id === DBASE); if (!BO) { BO = O[0]; DBASE = 'live'; }
  if (DCMP && !O.some(o => o.id === DCMP && o.id !== BO.id)) DCMP = null;   // 지워진 회차를 고르고 있었으면 자동으로
  const CID = DCMP === null ? defaultCmp(O, BO) : DCMP;                      // null = 기준 바로 앞 회차(자동), '' = 비교 안 함
  const CO = CID ? O.find(o => o.id === CID) : null, LIVE = !!BO.live;
  const S = LIVE ? KC.applicantStats(cfg, D.participants) : BO.st, PV = CO ? CO.st : null;
  const kpi = (label, v, pv, cls, sub) => '<div class="kpi ' + (cls || '') + '"><b>' + nf(v) + '</b><span>' + esc(label) + '</span>' + (sub ? '<small class="kd">' + esc(sub) + '</small>' : '') + (PV && pv != null ? '<small class="kd">' + esc(deltaTxt(v, pv, yPrev)) + '</small>' : '') + '</div>';
  const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '';
  // 부문 × 구분
  const keys = LIVE ? D.groupKeys.slice() : []; Object.keys(S.groups).concat(PV ? Object.keys(PV.groups || {}) : []).forEach(k => { if (!keys.includes(k)) keys.push(k); });
  const gsort = {}; D.groups.forEach(g => { const d = g.groupKey.split('|')[0], v = +g.sort || 999; gsort[d] = Math.min(gsort[d] || 999, v); });
  keys.sort((a, b) => (gsort[a.split('|')[0]] || 999) - (gsort[b.split('|')[0]] || 999) || KC.groupKeyCmp(a, b));
  const divs = []; keys.forEach(k => { const d = k.split('|')[0]; if (!divs.includes(d)) divs.push(d); });
  const Z = { n: 0, paid: 0, wait: 0, m: 0, f: 0, far: 0 }, add = (a, b) => { Object.keys(Z).forEach(f => a[f] += (b && b[f]) || 0); return a; };
  const line = (cls, a, b, G, pg) => '<tr class="' + cls + '"><td>' + a + '</td><td>' + b + '</td><td class="n"><b>' + nf(G.n) + '</b></td><td class="n">' + nf(G.paid) + '</td><td class="n">' + (G.wait ? nf(G.wait) : '') + '</td><td class="n">' + (G.m || '') + '</td><td class="n">' + (G.f || '') + '</td><td class="n">' + (G.far || '') + '</td>' +
    (PV ? '<td class="n muted">' + (pg ? nf(pg.n) : '') + '</td><td class="n">' + (pg ? dTxt(G.n - pg.n) : '') + '</td>' : '') + '</tr>';
  const dTxt = d => d > 0 ? '▲' + d : d < 0 ? '▼' + (-d) : '–';
  let body = '', TT = Object.assign({}, Z), TP = PV ? Object.assign({}, Z) : null;
  divs.forEach(dv => {
    const ks = keys.filter(k => k.split('|')[0] === dv), sub = Object.assign({}, Z), psub = Object.assign({}, Z);
    ks.forEach((k, i) => {
      const G = S.groups[k] || Z, pg = PV ? (PV.groups || {})[k] : null;
      add(sub, G); if (pg) add(psub, pg);
      body += line('', i ? '' : '<b>' + esc(dv) + '</b>', esc(k.split('|')[1] || ''), G, PV ? (pg || Z) : null);
    });
    if (ks.length > 1) body += line('sub', '', '소계', sub, PV ? psub : null);
    add(TT, sub); if (TP) add(TP, psub);
  });
  body += line('hl', '<b>합계</b>', '', TT, TP);
  // 부문 × 구분 피벗 — 왼쪽 부문, 위쪽 구분 / 올해 표 오른쪽에 전년 표
  const baseCat = c => String(c || '').replace(/\((남|여)\)$/, ''), gOf = c => (/\((남|여)\)$/.exec(c || '') || [])[1] || '';
  const catName = c => c === '대학일반부' ? '대학·일반부' : c;
  const cats = []; keys.forEach(k => { const c = baseCat(k.split('|')[1]); if (c && !cats.includes(c)) cats.push(c); });
  cats.sort((a, b) => KC.groupKeyCmp('x|' + a, 'x|' + b));
  const offCur = new Set((LIVE ? D.groupKeys : []).concat(Object.keys(S.groups))), offPrev = new Set(PV ? Object.keys(PV.groups || {}) : []);

function readBank(file) {

function fallbackCopy(v, isHTML, msg) {

function saveBlob(content, name, type) {

  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

function seasonsOverview(SE, stOf, ln) {
  const cols = SE.slice().sort((a, b) => +a.no - +b.no).map(z => ({ id: 's' + z.no, short: z.no + '회', year: stOf(z).year || z.year || '', st: stOf(z) }));

  const catName = c => c === '대학일반부' ? '대학·일반부' : c;
  const divs = [], cats = [];
  cols.forEach(c => Object.keys(c.st.groups || {}).forEach(k => { const [d, ct] = k.split('|'); if (!divs.includes(d)) divs.push(d); if (ct && !cats.includes(base(ct))) cats.push(base(ct)); }));
  divs.sort((a, b) => KC.groupKeyCmp(a + '|', b + '|')); cats.sort((a, b) => KC.groupKeyCmp('x|' + a, 'x|' + b));
  if (ACAT && !cats.includes(ACAT)) ACAT = '';
  const val = (st, dv) => { let v = 0, has = false; Object.keys(st.groups || {}).forEach(k => { const [d, ct] = k.split('|'); if (d === dv && (!ACAT || base(ct) === ACAT)) { has = true; v += st.groups[k].n || 0; } }); return has ? v : null; };
  const tot = cols.map(c => divs.reduce((a, d) => a + (val(c.st, d) || 0), 0));
  const dl = (a, b) => { const d = a - b; return d > 0 ? '<span class="up">▲' + nf(d) + '</span>' : d < 0 ? '<span class="dn">▼' + nf(-d) + '</span>' : '<span class="muted">–</span>'; };
  return '<div class="card" style="margin-top:16px"><div class="row" style="align-items:center"><h2 style="margin:0">회차별 한눈에</h2><span class="sp"></span>' +

    '<p class="small muted" style="margin:6px 0 0">신청(취소·환불 제외) 인원' + (ACAT ? ' — ' + esc(catName(ACAT)) + '만' : '') + '. 회차 이름을 누르면 그 회차 기준으로 현황 탭이 열려요.' + (cols.some(c => c.live) ? ' 올해 칸은 지금까지 들어온 인원이라 접수 중에는 앞 회차보다 적게 보여요.' : '') + '</p>' +
    '<div class="scroll" style="margin-top:10px"><table class="gtab pv"><thead><tr><th class="h">부문</th>' +
      cols.map((c, i) => '<th class="' + (i ? '' : 'b') + (c.live ? ' t' : '') + '"><button class="linkish" data-ov="' + c.id + '" style="font-weight:800">' + esc(c.short) + '</button><br><small class="muted" style="font-weight:500">' + esc(c.year) + (c.live ? ' · 올해' : '') + '</small></th>').join('') +
      (cols.length > 1 ? '<th class="b">앞 회차 대비</th>' : '') + '</tr></thead><tbody>' +
    divs.map(d => { const v = cols.map(c => val(c.st, d)), L = v.length;
      return '<tr><td><b>' + esc(d) + '</b></td>' + v.map((x, i) => '<td class="' + (i ? '' : 'b') + (cols[i].live ? ' t' : '') + '">' + (x == null ? '' : nf(x)) + '</td>').join('') +
        (L > 1 ? '<td class="b">' + (v[L - 1] != null && v[L - 2] != null ? dl(v[L - 1], v[L - 2]) : '') + '</td>' : '') + '</tr>'; }).join('') +
    '<tr class="hl"><td>합계</td>' + tot.map((x, i) => '<td class="' + (i ? '' : 'b') + (cols[i].live ? ' t' : '') + '">' + nf(x) + (i ? '<br><small style="font-weight:500">' + dl(x, tot[i - 1]) + '</small>' : '') + '</td>').join('') +

}
