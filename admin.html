<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>콩쿠르 운영 관리</title>
<link rel="stylesheet" href="style.css">
<style>
  .gtab td, .gtab th { white-space: nowrap; }
  .tb-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .tb-tools input, .tb-tools select { width: auto; min-width: 140px; }
  td.ed { cursor: pointer; }
  td.ed:hover { outline: 2px solid var(--accent-soft); }
  td.miss { background: var(--warn-soft); }
  .judge-c { text-align: center; min-width: 38px; }
  .flagrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .flagrow:last-child { border-bottom: 0; }
  .flagrow b { flex: 1; font-weight: 600; }
  .switch { position: relative; width: 52px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: #cfc6ca; border-radius: 99px; transition: .15s; }
  .switch span::after { content: ''; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { left: 25px; }
  .mapgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
  .mapgrid label { font-size: 13px; color: var(--sub); font-weight: 700; }
  .mapgrid select { min-height: 38px; padding: 6px 8px; font-size: 14px; }
  .mlist { max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
  .ntv { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-top: 6px; font-size: 15px; line-height: 1.7; max-height: 60vh; overflow: auto; background: #fff; }
  .ntv p { margin: 0; } .ntv table { width: auto; margin: 6px 0; } .ntv td, .ntv th { border: 1px solid #999; padding: 4px 10px; }
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="store-local.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="app.js"></script>
<script src="timetable.js"></script>
<script src="notices.js"></script>
<script src="forms.js"></script>
<script src="docfill.js"></script>
<script src="crypto.js"></script>
<script src="admin-docs.js"></script>
<script>
{
const { $, $$, esc, api, toast, modal, confirmBox, busy, fmtDate, fmtBirth } = App;
App.demoBar();
const app = $('#app');
const TABS = [['dash', '현황'], ['people', '참가자'], ['pay', '입금대조'], ['plan', '시간표'], ['sched', '조편성'], ['print', '출석부·인쇄'], ['judges', '심사위원'], ['results', '채점결과'], ['notice', '공지'], ['docs', '문서·출력'], ['staff', '인력·지급'], ['settings', '설정']];
let D = null, TAB = (location.hash || '#dash').slice(1), ROUND = 'R1', RES_GROUP = null, PFILTER = { q: '', g: '', pay: '' };
if (!TABS.some(t => t[0] === TAB)) TAB = 'dash';

const isPaid = p => KC.isPaid(p), isActive = p => KC.isActive(p);
const PT = (p, r) => KC.piecesText(KC.piecesFor(p, r));           // 곡목 한 줄 텍스트
const GL = k => KC.groupLabel(k);
const call = (a, p) => api(a, p, 'admin');
function onErr(e) { if (e.needLogin) needLogin(); else toast(e.message, 'bad'); }
function needLogin() { App.loginView(app, 'admin', '콩쿠르 운영 관리', '관리자 비밀번호를 입력해 주세요.', () => load()); }
const rname = r => r === 'R2' ? (D.cfg.r2Name || '본선') : (D.cfg.r1Name || '예선');

function load() {
  return call('adminLoad').then(d => { D = d; App.applyTheme(d.cfg.themeColor); document.title = (d.cfg.shortTitle || '콩쿠르') + ' 운영 관리'; shell(); }).catch(onErr);
}
function shell() {
  app.innerHTML = '<header class="top"><div class="wrap"><div class="brand">' + esc(D.cfg.title) + '<small>운영 관리</small></div><span class="sp"></span>' +
    '<a class="btn sm" href="index.html" target="_blank" rel="noopener">참가자 조회</a><a class="btn sm" href="desk.html" target="_blank" rel="noopener">현장</a><a class="btn sm" href="judge.html" target="_blank" rel="noopener">심사위원</a><button class="sm" id="rl">새로고침</button><button class="sm" id="lo">나가기</button></div></header>' +
    '<main class="wrap" style="padding-top:8px;padding-bottom:60px"><nav class="tabs" role="tablist">' + TABS.map(t => '<button data-t="' + t[0] + '" class="' + (t[0] === TAB ? 'on' : '') + '">' + t[1] + '</button>').join('') + '</nav><div id="view"></div></main>';
  $$('[data-t]').forEach(b => b.addEventListener('click', () => { TAB = b.dataset.t; location.hash = TAB; JDRAFT = null; load(); }));
  $('#rl').addEventListener('click', () => load().then(() => toast('최신 데이터로 불러왔어요')));
  $('#lo').addEventListener('click', () => { App.setToken('admin', null); needLogin(); });
  ({ dash, people, pay, plan: planTab, sched, print: printTab, judges, results, notice: noticeTab, docs: () => ADMX.docs(), staff: () => ADMX.staff(), settings })[TAB]();
}
const view = () => $('#view');
const refresh = () => load();
// 문서·출력 / 인력·지급 탭(admin-docs.js)에 넘겨 주는 것
window.ADM = { get D() { return D; }, call, load, refresh, view, onErr, rname, GL };

/* ================= 현황 ================= */
function dash() {
  const P = D.participants.filter(isActive), cnt = (f) => P.filter(f).length;
  const e1 = D.entries.filter(e => e.round === 'R1'), e2 = D.entries.filter(e => e.round === 'R2');
  const res1 = Object.values(D.results.R1), done1 = res1.reduce((a, g) => a + g.completed, 0), tot1 = res1.reduce((a, g) => a + g.total, 0);
  const rows = D.groupKeys.map(k => {
    const ps = P.filter(p => p.groupKey === k), pk = new Set(ps.map(p => p.id));
    const r1 = e1.filter(e => pk.has(e.pid)), r2 = e2.filter(e => pk.has(e.pid));
    return { k, n: ps.length, paid: ps.filter(isPaid).length, s1: D.sessions.filter(s => s.round === 'R1' && s.groupKey === k).length, r1: r1.length, att: r1.filter(e => e.attend === 'Y').length, pass: r1.filter(e => e.pass === 'Y').length, r2: r2.length };
  });
  const sum = f => rows.reduce((a, r) => a + r[f], 0);
  view().innerHTML = '<div class="grid g4" style="margin-bottom:20px">' +
    '<div class="kpi hl"><b>' + P.length + '</b><span>신청 (취소 제외)</span></div>' +
    '<div class="kpi"><b>' + cnt(isPaid) + '</b><span>입금 확인</span></div>' +
    '<div class="kpi"><b>' + cnt(p => !isPaid(p)) + '</b><span>미입금</span></div>' +
    '<div class="kpi"><b>' + e1.length + '</b><span>' + esc(rname('R1')) + ' 편성</span></div>' +
    '<div class="kpi"><b>' + e1.filter(e => e.attend === 'Y').length + '</b><span>' + esc(rname('R1')) + ' 출석</span></div>' +
    '<div class="kpi"><b>' + (tot1 ? Math.round(done1 / tot1 * 100) : 0) + '%</b><span>' + esc(rname('R1')) + ' 채점 완료</span></div>' +
    '<div class="kpi"><b>' + e1.filter(e => e.pass === 'Y').length + '</b><span>' + esc(rname('R2')) + ' 진출</span></div></div>' +
    '<div class="card"><h2>부문별 인원</h2><div class="scroll"><table class="gtab"><thead><tr><th>부문</th><th>구분</th><th class="n">신청</th><th class="n">입금확인</th><th class="n">미입금</th><th class="n">' + esc(rname('R1')) + ' 조</th><th class="n">편성</th><th class="n">출석</th><th class="n">' + esc(rname('R2')) + ' 진출</th><th class="n">' + esc(rname('R2')) + ' 편성</th></tr></thead><tbody>' +
    rows.map(r => { const [a, b] = r.k.split('|'); return '<tr><td><b>' + esc(a) + '</b></td><td>' + esc(b) + '</td><td class="n">' + r.n + '</td><td class="n">' + r.paid + '</td><td class="n">' + (r.n - r.paid || '') + '</td><td class="n">' + (r.s1 || '') + '</td><td class="n">' + (r.r1 || '') + '</td><td class="n">' + (r.att || '') + '</td><td class="n">' + (r.pass || '') + '</td><td class="n">' + (r.r2 || '') + '</td></tr>'; }).join('') +
    '<tr class="hl"><td colspan="2"><b>합계</b></td><td class="n"><b>' + sum('n') + '</b></td><td class="n">' + sum('paid') + '</td><td class="n">' + (sum('n') - sum('paid')) + '</td><td class="n">' + sum('s1') + '</td><td class="n">' + sum('r1') + '</td><td class="n">' + sum('att') + '</td><td class="n">' + sum('pass') + '</td><td class="n">' + sum('r2') + '</td></tr>' +
    '</tbody></table></div><div class="row end" style="margin-top:12px"><button id="xcnt">인원 현황 엑셀</button></div></div>' +
    (D.participants.length ? '' : '<div class="note" style="margin-top:16px">아직 참가자가 없어요. <b>참가자</b> 탭에서 홈페이지 신청자 엑셀을 불러오세요.</div>');
  $('#xcnt').addEventListener('click', () => App.writeXlsx([{ name: '부문별 인원', rows: [['부문', '구분', '신청', '입금확인', '미입금', '예선 조', '예선 편성', '출석', '본선 진출', '본선 편성']].concat(rows.map(r => { const [a, b] = r.k.split('|'); return [a, b, r.n, r.paid, r.n - r.paid, r.s1, r.r1, r.att, r.pass, r.r2]; })) }], '부문별인원_' + App.today() + '.xlsx'));
}

/* ================= 참가자 ================= */
function people() {
  view().innerHTML = '<div class="tb-tools"><label class="btn pri" style="cursor:pointer">신청자 엑셀 불러오기<input type="file" id="imp" accept=".xlsx,.xls,.csv" hidden></label><button id="exp">엑셀로 내보내기</button><button id="add">한 명 추가</button><span class="sp"></span>' +
    '<input id="q" placeholder="이름·접수번호·학교 검색" value="' + esc(PFILTER.q) + '"><select id="g"><option value="">전체 부문</option>' + D.groupKeys.map(k => '<option ' + (PFILTER.g === k ? 'selected' : '') + ' value="' + esc(k) + '">' + esc(GL(k)) + '</option>').join('') + '</select>' +
    '<select id="pf"><option value="">입금 전체</option><option value="Y" ' + (PFILTER.pay === 'Y' ? 'selected' : '') + '>입금 확인</option><option value="N" ' + (PFILTER.pay === 'N' ? 'selected' : '') + '>미입금</option><option value="X" ' + (PFILTER.pay === 'X' ? 'selected' : '') + '>취소</option></select></div>' +
    '<div id="pt"></div>';
  $('#imp').addEventListener('change', e => { if (e.target.files[0]) importFile(e.target.files[0]); e.target.value = ''; });
  $('#exp').addEventListener('click', exportPeople);
  $('#add').addEventListener('click', () => editPerson({ id: '', status: '정상' }));
  ['q', 'g', 'pf'].forEach(id => $('#' + id).addEventListener('input', () => { PFILTER = { q: $('#q').value, g: $('#g').value, pay: $('#pf').value }; drawPeople(); }));
  drawPeople();
}
function filteredPeople() {
  const q = PFILTER.q.trim();
  return D.participants.filter(p => (!PFILTER.g || p.groupKey === PFILTER.g) &&
    (!PFILTER.pay || (PFILTER.pay === 'X' ? !isActive(p) : isActive(p) && (PFILTER.pay === 'Y' ? isPaid(p) : !isPaid(p)))) &&
    (!q || [p.name, p.id, p.school, p.phone, p.guardianName].some(v => String(v || '').indexOf(q) >= 0)))
    .sort((a, b) => KC.cmpKo(a.groupKey, b.groupKey) || KC.cmpKo(a.name, b.name));
}
function drawPeople() {
  const list = filteredPeople(), show = list.slice(0, 400);
  $('#pt').innerHTML = '<p class="small muted">' + list.length + '명' + (list.length > 400 ? ' (앞의 400명만 표시 — 검색으로 좁혀 주세요)' : '') + '</p>' +
    (list.length ? '<div class="scroll card" style="padding:0;max-height:70vh"><table><thead><tr><th>접수번호</th><th>이름</th><th>생년월일</th><th>부문</th><th class="hide-m">학교·학년</th><th class="hide-m">지역</th><th class="hide-m">연락처</th><th>입금</th><th></th></tr></thead><tbody>' +
      show.map(p => '<tr class="' + (isActive(p) ? '' : 'dim') + '"><td class="num">' + esc(p.id) + '</td><td><b>' + esc(p.name) + '</b></td><td class="num">' + esc(fmtBirth(p.birth)) + '</td><td>' + esc(GL(p.groupKey)) + '</td><td class="hide-m small">' + esc(p.school) + ' ' + esc(p.grade) + '</td><td class="hide-m small">' + (p.region ? (KC.isFar(D.cfg, p) ? '<span class="badge warn">' + esc(p.region) + '</span>' : esc(p.region)) : '') + '</td><td class="hide-m small num">' + esc(App.phone4(p.phone)) + (p.guardianPhone ? ' / 보호자 ' + esc(App.phone4(p.guardianPhone)) : '') + '</td>' +
        '<td>' + (!isActive(p) ? '<span class="badge">취소</span>' : isPaid(p) ? '<span class="badge ok">확인</span>' : '<span class="badge warn">미입금</span>') + (p.piecesAt ? ' <span class="badge acc" title="참가자가 곡목을 고친 시각">곡목 수정 ' + esc(String(p.piecesAt).slice(5, 16)) + '</span>' : '') + '</td><td><button class="sm" data-ed="' + esc(p.id) + '">수정</button></td></tr>').join('') +
      '</tbody></table></div>' : '<div class="empty">참가자가 없어요. 홈페이지에서 내려받은 신청자 엑셀(신청자관리 xlsx)을 불러오세요.</div>');
  $$('[data-ed]').forEach(b => b.addEventListener('click', () => editPerson(D.participants.find(p => p.id === b.dataset.ed))));
}
function editPerson(p) {
  const F = [['id', '접수번호'], ['name', '이름'], ['birth', '생년월일(6자리)'], ['gender', '성별'], ['division', '지원 부문'], ['category', '지원 구분'], ['school', '학교'], ['grade', '학년'], ['phone', '휴대폰'], ['guardianName', '보호자 이름'], ['guardianPhone', '보호자 휴대폰'], ['email', '이메일'], ['zip', '우편번호'], ['address', '주소 (시·도 판별용)'], ['payStatus', '결제 상태'], ['payMemo', '입금 메모'], ['status', '상태(정상/취소)'], ['teacher', '사사 선생님'], ['note', '비고']];
  const m = modal('<h2>' + (p.id ? esc(p.name) + ' 정보 수정' : '참가자 추가') + '</h2><form id="pe"><div class="grid g2" style="gap:10px">' + F.map(f => '<div><label class="f">' + f[1] + '</label><input name="' + f[0] + '" value="' + esc(p[f[0]] || '') + '" ' + (f[0] === 'id' && p.id ? 'readonly' : '') + '></div>').join('') + '</div>' +
    '<h3 style="margin-top:16px">곡목</h3><p class="small muted" style="margin-top:-4px">성악처럼 참가자가 곡을 고르는 부문만 쓰면 돼요. 라운드마다 위에서부터 ①②③ 순서로 심사위원 화면에 보여요. ▲▼로 순서를 바꿀 수 있어요.' + (p.piecesAt ? ' <b>참가자가 ' + esc(p.piecesAt) + '에 직접 수정함.</b>' : '') + '</p>' +
    '<div class="scroll"><table id="pcs"><thead><tr><th>라운드</th><th>구분</th><th>국가</th><th>작곡가</th><th>곡명</th><th></th></tr></thead><tbody></tbody></table></div><button type="button" class="sm" id="pca" style="margin-top:8px">곡 추가</button>' +
    '<p class="small muted">부문·구분·성별을 바꾸면 편성 부문(예: 성악 고등부(남))이 다시 계산돼요. 이미 조편성이 끝났다면 조편성 탭에서 옮겨 주세요.</p>' +
    '<div class="row end"><button type="button" data-close>닫기</button><button class="pri">저장</button></div></form>', { wide: true });
  let PCS = KC.parsePieces(p.pieces).map(x => Object.assign({}, x));
  const W = { kind: 104, country: 84, composer: 150, title: 300 };
  const drawPcs = () => {
    $('#pcs tbody', m.el).innerHTML = PCS.map((x, i) => '<tr data-i="' + i + '"><td><select data-k="round" style="min-height:36px;padding:4px 6px;font-size:14px;width:84px"><option value="R1" ' + (x.round !== 'R2' ? 'selected' : '') + '>' + esc(rname('R1')) + '</option><option value="R2" ' + (x.round === 'R2' ? 'selected' : '') + '>' + esc(rname('R2')) + '</option></select></td>' +
      ['kind', 'country', 'composer', 'title'].map(k => '<td><input data-k="' + k + '" value="' + esc(x[k] || '') + '" style="min-height:36px;padding:4px 8px;font-size:14px;width:' + W[k] + 'px"></td>').join('') + '<td style="white-space:nowrap"><button type="button" class="sm" data-up="' + i + '" ' + (i === 0 ? 'disabled' : '') + ' aria-label="위로">▲</button><button type="button" class="sm" data-dn="' + i + '" ' + (i === PCS.length - 1 ? 'disabled' : '') + ' aria-label="아래로">▼</button> <button type="button" class="sm danger" data-x="' + i + '">삭제</button></td></tr>').join('') || '<tr><td colspan="6" class="muted small">곡목 없음</td></tr>';
    $$('#pcs [data-k]', m.el).forEach(inp => inp.addEventListener('input', () => { PCS[+inp.closest('tr').dataset.i][inp.dataset.k] = inp.value; }));
    $$('#pcs [data-x]', m.el).forEach(b => b.addEventListener('click', () => { PCS.splice(+b.dataset.x, 1); drawPcs(); }));
    const sw = (a, b) => { const x = PCS[a]; PCS[a] = PCS[b]; PCS[b] = x; drawPcs(); };
    $$('#pcs [data-up]', m.el).forEach(b => b.addEventListener('click', () => sw(+b.dataset.up, +b.dataset.up - 1)));
    $$('#pcs [data-dn]', m.el).forEach(b => b.addEventListener('click', () => sw(+b.dataset.dn, +b.dataset.dn + 1)));
  };
  drawPcs();
  $('#pca', m.el).addEventListener('click', () => { const last = PCS[PCS.length - 1]; PCS.push({ round: last ? last.round : 'R1', kind: '', country: '', composer: '', title: '' }); drawPcs(); });
  $('#pe', m.el).addEventListener('submit', e => {
    e.preventDefault();
    const row = {}; new FormData(e.target).forEach((v, k) => row[k] = v);
    row.pieces = PCS.map(x => ({ round: x.round || 'R1', kind: x.kind || '', country: x.country || '', composer: x.composer || '', title: x.title || '' }));
    if (!row.id) { toast('접수번호를 넣어 주세요', 'bad'); return; }
    call('saveParticipant', { row }).then(() => { m.close(); toast('저장했어요', 'ok'); refresh(); }).catch(onErr);
  });
}
function importFile(file) {
  App.readWorkbook(file).then(sheets => {
    let sh = sheets[0], hi = -1;
    for (const s of sheets) { hi = App.findHeaderRow(s.rows, ['이름']); if (hi >= 0) { sh = s; break; } }
    if (hi < 0) { toast('"이름" 열이 있는 머리글 줄을 찾지 못했어요.', 'bad'); return; }
    const header = sh.rows[hi].map(x => String(x).trim()), body = sh.rows.slice(hi + 1).filter(r => r.some(c => String(c).trim()));
    const map = App.autoMap(header);
    const opts = '<option value="-1">(없음)</option>' + header.map((h, i) => '<option value="' + i + '">' + esc(h || ('열' + (i + 1))) + '</option>').join('');
    const m = modal('<h2>신청자 엑셀 불러오기</h2><p class="muted small">' + esc(file.name) + ' · 시트 "' + esc(sh.name) + '" · ' + body.length + '줄. 열 연결을 확인해 주세요.</p>' +
      '<div class="mapgrid">' + Object.keys(App.FIELD_LABEL).map(f => '<div><label>' + App.FIELD_LABEL[f] + (['id', 'name', 'birth', 'division', 'category'].includes(f) ? ' *' : '') + '</label><select data-f="' + f + '">' + opts + '</select></div>').join('') + '</div>' +

let PAYRES = null;

function readBank(file) {
  App.readWorkbook(file).then(sheets => {
    let sh = null, hi = -1;
    for (const s of sheets) { hi = App.findHeaderRow(s.rows, ['적요']); if (hi < 0) hi = App.findHeaderRow(s.rows, ['입금']); if (hi >= 0) { sh = s; break; } }
    if (!sh) { toast('"적요" 또는 "입금" 열을 찾지 못했어요.', 'bad'); return; }
    const h = sh.rows[hi].map(x => String(x).replace(/\s/g, ''));
    const find = (...names) => { for (const n of names) { const i = h.findIndex(x => x === n); if (i >= 0) return i; } for (const n of names) { const i = h.findIndex(x => x.indexOf(n) >= 0); if (i >= 0) return i; } return -1; };
    const di = find('거래일자', '거래일시', '일자', '날짜'), ai = find('입금액', '입금(원)', '맡기신금액', '입금'), mi = find('적요', '입금자명', '보낸분', '기재내용', '내용');
    if (ai < 0 || mi < 0) { toast('입금액·적요 열을 찾지 못했어요.', 'bad'); return; }
    const deps = sh.rows.slice(hi + 1).map(r => ({ date: r[di] || '', amount: r[ai], memo: r[mi] })).filter(d => +String(d.amount).replace(/\D/g, '') > 0 && String(d.memo).trim());
    const res = KC.matchDeposits(D.participants, deps, $('#fee').value);
    PAYRES = { file: file.name, deps: deps.length, res };
    drawPay();
  }).catch(e => toast('엑셀을 읽지 못했어요: ' + e.message, 'bad'));
}

      '<td>' + status + (ROUND === 'R1' && !r.absent ? ' <button class="ghost sm" data-ps="' + esc(r.entryId) + '" data-v="' + (r.pass === 'Y' ? 'N' : 'Y') + '">' + (r.pass === 'Y' ? '탈락으로' : '본선으로') + '</button>' : '') + '</td></tr>';
  }).join('');
  $('#rg').innerHTML = top + '<div class="card"><div class="row"><h3 style="margin:0">채점표</h3><span class="sp"></span><button class="sm" id="xg">이 부문 결과 엑셀</button><button class="sm" id="pg">결과표 인쇄</button></div>' +
    '<p class="small muted">빈 칸(노란색)은 아직 채점 안 된 곳이에요. 종이 채점표로 받은 점수는 칸을 눌러 직접 넣을 수 있어요.</p>' +
    '<div class="scroll"><table><thead><tr><th class="n">연주순서</th><th>이름</th>' + J.map(j => '<th class="judge-c" title="' + esc(j.name) + '">' + esc(j.letter) + '<div class="small" style="font-weight:500">' + esc(j.name) + '</div></th>').join('') +
    (isOx ? '<th class="n">O 개수</th>' : '<th class="n">등위합</th><th class="n">유효등위</th><th class="n">순위</th>') + '<th>결과</th></tr></thead><tbody>' + body + '</tbody></table></div></div>';
  $$('[data-cut]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.cut;
    const n = v === '' ? 0 : g.rows.filter(r => !r.absent && r.scored && r.score >= +v).length;
    confirmBox(v === '' ? '커트라인을 지우고 본선 진출 표시를 모두 없앨까요?' : 'O ' + v + '개 이상, ' + n + '명을 본선 진출로 확정할까요?\n(나중에 바꿀 수 있어요. 본선 조편성 전에 확정해 주세요.)', '확정').then(ok => ok && call('setCutline', { groupKey: g.groupKey, cutline: v }).then(c => { toast(v === '' ? '커트라인을 지웠어요' : '본선 진출 ' + c + '명', 'ok'); refresh(); }).catch(onErr));
  }));
  $$('[data-ps]').forEach(b => b.addEventListener('click', () => call('setPass', { entryId: b.dataset.ps, pass: b.dataset.v }).then(() => refresh()).catch(onErr)));

  }));

}
function resultRows(g, withNames) {
  const isOx = g.mode === 'ox';
  const wp = g.rows.some(r => r.pieces && r.pieces.length);
  const head = ['연주순서', '이름', '학교', '학년', '생년월일'].concat(g.judges.map(j => withNames ? j.letter + ' ' + j.name : j.letter)).concat(isOx ? ['O 개수', '결과'] : ['등위합', '유효등위', '순위', '입상']).concat(wp ? ['곡목'] : []);
  return [head].concat(g.rows.map(r => [r.perfOrder == null ? '' : r.perfOrder, r.name, r.school, r.grade, r.birth].concat(r.values.map(v => v == null ? '' : isOx ? (v > 0 ? 'O' : 'X') : v))
    .concat(r.absent ? (isOx ? ['', '불참'] : ['', '', '', '불참']) : isOx ? [r.score, r.pass === 'Y' ? '본선진출' : r.pass === 'N' ? '' : ''] : [r.total, r.effective, r.rank || '', r.award || ''])
    .concat(wp ? [KC.piecesText(r.pieces || [])] : [])));
}
function exportAllResults() {
  const R = D.results[ROUND];
  App.writeXlsx(Object.keys(R).map(k => ({ name: GL(k), rows: resultRows(R[k], true) })), rname(ROUND) + '_전체결과_' + App.today() + '.xlsx');
}
function printResult(g) {
  const isOx = g.mode === 'ox', rows = resultRows(g, true);
  App.printHTML('<div class="pr"><h1>' + esc(D.cfg.title) + ' — ' + esc(rname(ROUND)) + ' 채점 결과</h1><div class="meta"><span>' + esc(GL(g.groupKey)) + '</span><span>' + (isOx && g.cutline !== '' ? '본선 진출 기준 O ' + esc(g.cutline) + '개 이상 · ' + g.passed + '명' : '') + '</span><span>출력 ' + esc(App.today()) + '</span></div><table><thead><tr>' + rows[0].map(h => '<th>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' + rows.slice(1).map(r => '<tr>' + r.map(c => '<td>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>' +
    '<p style="margin-top:10mm">위와 같이 심사 결과를 확인합니다.</p><p style="text-align:right">' + g.judges.map(j => esc(j.name) + ' (인)').join('&nbsp;&nbsp;&nbsp;') + '</p></div>');
}
function fakeScores() {
  // 데모 전용: 현재 부문 모든 연주자에게 임의 점수
  const g = D.results[ROUND][RES_GROUP], st = App.store();
  const mode = g.mode, max = +(ROUND === 'R2' ? D.cfg.r2Max : D.cfg.r1Max) || 5;
  const J = g.judges.length ? g.judges : D.judges.filter(j => j.round === ROUND);
  if (!J.length) { toast('이 라운드 심사위원이 없어요', 'bad'); return; }
  const rows = [];
  g.rows.forEach(r => { if (r.absent) return; const skill = Math.random(); J.forEach(j => { const v = mode === 'ox' ? (Math.random() < skill ? 1 : 0) : Math.max(1, Math.min(max, Math.round((1 - skill) * max + (Math.random() * 2 - 1)))); rows.push({ scoreId: ROUND + '|' + r.pid + '|' + j.judgeId, round: ROUND, pid: r.pid, sessionId: r.sessionId, judgeId: j.judgeId, value: String(v), comment: '', updatedAt: '데모' }); }); });
  st.upsert('Scores', 'scoreId', rows);
  toast('임의 점수를 채웠어요', 'ok'); refresh();
}
