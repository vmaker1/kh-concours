<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>심사위원 채점</title>
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--panel); padding-bottom: env(safe-area-inset-bottom); }
  .scard .t { font-size: 19px; font-weight: 700; }
  .sheet-h { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); }
  .sheet-h .wrap { padding-top: 10px; padding-bottom: 10px; }
  .pf { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 12px; align-items: center; }
  .pf.done { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .pf.absent { opacity: .45; }
  .pf.now { border: 2px solid var(--accent); box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 18%, transparent); }
  .pf .no { text-align: center; }
  .pf .no b { display: block; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  .pf .no small { display: block; font-size: 12px; color: var(--sub); }
  .pf .no .badge { font-size: 11.5px; padding: 2px 7px; margin-bottom: 4px; }
  .vals { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .vals button { min-width: 56px; min-height: 56px; font-size: 22px; font-weight: 800; border-radius: 12px; padding: 0; flex: 1 1 0; max-width: 90px; }
  .vals.ox button { max-width: 130px; font-size: 28px; }
  .vals button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .vals button.x.on { background: #3d3940; border-color: #3d3940; }
  .st { font-size: 12px; text-align: right; min-height: 16px; color: var(--sub); }
  .st.err { color: var(--bad); font-weight: 700; }
  .cm { grid-column: 1 / -1; }
  .songs { margin-bottom: 10px; padding: 8px 10px; background: var(--panel); border-radius: 10px; }
  .pf.absent .songs { display: none; }
  .cm textarea { min-height: 70px; font-size: 15px; }
  .foot { position: sticky; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); z-index: 5; }
  .info:empty { display: none; }
  @media (min-width: 760px) {
    .pf { grid-template-columns: 6em minmax(0, 1fr); }
    .pf .body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); gap: 16px; align-items: center; }
    .pf .info:empty { display: block; }
    .pf .songs { margin: 0; }
    .cm { grid-column: 2; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading">불러오는 중…</div></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="store-local.js"></script>
<script src="app.js"></script>
<script>
{
  const { $, $$, esc, api, toast, busy, fmtDate, confirmBox } = App;
  App.demoBar();
  const app = $('#app');
  let HOME = null, SHEET = null, CUR = null, timer = null, pending = 0, showComments = false, lastCurrent = '', lastTouch = 0;
  ['pointerdown', 'keydown', 'wheel', 'touchmove'].forEach(ev => window.addEventListener(ev, e => { if (e.isTrusted) lastTouch = Date.now(); }, { passive: true }));

  function needLogin() {
    clearInterval(timer);
    App.loginView(app, 'judge', '심사위원 채점', '사무국에서 받은 PIN을 입력해 주세요.', () => home());
  }
  function onErr(e) { if (e.needLogin) needLogin(); else toast(e.message, 'bad'); }

  function home() {
    clearInterval(timer); CUR = null;
    api('judgeHome', {}, 'judge').then(h => {
      HOME = h;
      const by = {};
      h.sessions.forEach(s => (by[s.date] = by[s.date] || []).push(s));
      app.innerHTML = '<header class="top"><div class="wrap"><div class="brand">' + esc(h.title) + '<small>' + esc(h.judge.roundName) + ' 심사 · ' + esc(h.judge.name) + ' 심사위원님</small></div><span class="sp"></span><button class="sm" id="lo">나가기</button></div></header>' +
        '<main class="wrap narrow" style="padding-top:20px;padding-bottom:40px">' +
        (h.sessions.length ? Object.keys(by).sort().map(d => '<h3 style="margin:18px 0 8px">' + esc(fmtDate(d, true)) + (d === App.today() ? ' <span class="badge acc">오늘</span>' : '') + '</h3>' +
          by[d].map(s => {
            const need = s.count - s.absent;
            return '<button class="scard" data-s="' + esc(s.sessionId) + '"><div class="row"><span class="t">' + esc(s.groupLabel) + ' ' + esc(s.label) + '</span><span class="sp"></span>' +
              (s.submittedAt ? '<span class="badge ok">제출 완료</span>' : s.locked ? '<span class="badge">마감</span>' : s.mine ? '<span class="badge warn">채점 중 ' + s.mine + '/' + need + '</span>' : '<span class="badge">대기</span>') + '</div>' +
              '<div class="muted small">' + esc(s.startTime) + '~' + esc(s.endTime) + ' · ' + s.count + '명' + (s.absent ? ' (불참 ' + s.absent + ')' : '') + ' · ' + esc(s.venue) + '</div></button>';
          }).join('')).join('') : '<div class="empty">배정된 조가 아직 없어요. 사무국에 문의해 주세요.</div>') +
        '</main>';
      $$('[data-s]').forEach(b => b.addEventListener('click', () => openSheet(b.dataset.s)));
      $('#lo').addEventListener('click', () => { App.setToken('judge', null); needLogin(); });
    }).catch(onErr);
  }

  function openSheet(sid, quiet) {
    CUR = sid;
    return api('judgeSheet', { sessionId: sid }, 'judge').then(sh => {
      SHEET = sh;
      renderSheet(quiet);
      clearInterval(timer);
      timer = setInterval(() => { if (!pending && CUR === sid && !document.activeElement.matches('textarea')) openSheet(sid, true).catch(() => {}); }, 12000);
    }).catch(onErr);
  }

  function valueButtons(r, ro) {
    const sh = SHEET;
    if (sh.mode === 'ox') {
      return '<div class="vals ox">' +
        '<button data-v="1" class="' + (r.value === '1' ? 'on' : '') + '" ' + ro + ' aria-label="O">○</button>' +
        '<button data-v="0" class="x ' + (r.value === '0' ? 'on' : '') + '" ' + ro + ' aria-label="X">✕</button></div>';
    }
    let h = '<div class="vals">';
    for (let i = 1; i <= sh.max; i++) h += '<button data-v="' + i + '" class="' + (r.value === String(i) ? 'on' : '') + '" ' + ro + '>' + i + '</button>';
    return h + '</div>';
  }

  function renderSheet(quiet) {
    const sh = SHEET, ro = (sh.submittedAt || sh.locked) ? 'disabled' : '';
    const scrollY = window.scrollY;
    const need = sh.list.filter(r => !r.absent).length, done = sh.list.filter(r => !r.absent && r.value !== '').length;
    const isRank = sh.mode !== 'ox';
    const cur = sh.list.find(r => r.pid === sh.currentPid);
    app.innerHTML = '<div class="sheet-h"><div class="wrap"><div class="row"><button class="sm" id="bk">← 목록</button><div><b>' + esc(sh.groupLabel) + ' ' + esc(sh.session.label) + '</b> <span class="muted small">' + esc(sh.roundName) + ' · ' + esc(fmtDate(sh.session.date)) + ' ' + esc(sh.session.startTime) + '</span></div><span class="sp"></span>' +
      (cur ? '<button class="sm pri" id="gonow">지금 ' + (cur.perfOrder != null ? cur.perfOrder + '번' : '연주') + ' ↓</button>' : '') +
      (isRank ? '<label class="inline small"><input type="checkbox" id="cmt" ' + (showComments ? 'checked' : '') + '> 심사평</label>' : '') + '<button class="sm" id="rf">새로고침</button></div>' +
      (isRank ? '<p class="small muted" style="margin:6px 0 0">1이 가장 높은 등위예요. 같은 등위를 여러 명에게 줄 수 있고, 본선 기준에 못 미치면 ' + sh.max + '를 주세요.</p>' : '<p class="small muted" style="margin:6px 0 0">본선에 올릴 연주자는 ○, 아니면 ✕를 눌러 주세요. 누르는 즉시 저장돼요.</p>') + '</div></div>' +
      '<main class="wrap" style="padding-top:14px;padding-bottom:20px;max-width:980px">' +
      (sh.submittedAt ? '<div class="note ok" style="margin-bottom:12px">' + esc(sh.submittedAt) + '에 제출했어요. 수정이 필요하면 사무국에 요청해 주세요.</div>' : sh.locked ? '<div class="note" style="margin-bottom:12px">이 조는 채점이 마감되었습니다.</div>' : '') +
      (sh.list.some(r => r.pieces && r.pieces.length) ? '<div class="note small" style="margin-bottom:12px">연주자마다 신청서에 적은 곡목을 ①②' + (sh.list.some(r => r.pieces.length > 2) ? '③' : '') + ' 순서로 보여 드려요.</div>' : '') +
      (sh.list.some(r => !r.drawNo) ? '<div class="note warn small" style="margin-bottom:12px">추첨 전인 연주자는 \'순번\'으로 표시돼요. 진행요원이 추첨번호를 넣으면 연주순서로 바뀝니다.</div>' : '') +
      sh.list.map((r, i) => '<div class="pf ' + (r.absent ? 'absent' : '') + (r.value !== '' ? ' done' : '') + (r.pid === sh.currentPid ? ' now' : '') + '" data-i="' + i + '" id="pf-' + esc(r.pid) + '">' +
        '<div class="no">' + (r.pid === sh.currentPid ? '<span class="badge acc" style="margin-bottom:4px">지금 연주</span>' : '') + (r.perfOrder != null ? '<small>연주순서</small><b>' + r.perfOrder + '</b>' : '<small>순번</small><b>' + r.seq + '</b>') + '</div>' +
        '<div class="body"><div class="info">' + (r.name ? '<div class="small"><b>' + esc(r.name) + '</b></div>' : '') + (r.pieces && r.pieces.length ? '<div class="songs">' + App.piecesHTML(r.pieces) + '</div>' : '') + '</div>' +
        '<div class="act">' + (r.absent ? '<span class="badge">불참</span>' : valueButtons(r, ro) + '<div class="st" data-st></div>') + '</div></div>' +
        (isRank && showComments && !r.absent ? '<div class="cm"><textarea placeholder="심사평 (테크닉, 음악성, 곡 이해, 장단점)" data-c ' + ro + '>' + esc(r.comment) + '</textarea></div>' : '') +
        '</div>').join('') +
      '</main><div class="foot"><div class="wrap narrow row"><div><b class="num" style="font-size:20px">' + done + '</b> / ' + need + ' 채점</div><span class="sp"></span>' +
      (sh.submittedAt ? '<span class="badge ok">제출 완료</span>' : '<button class="pri big" id="sub" ' + (ro || (done < need ? '' : '')) + '>채점표 제출</button>') + '</div></div>';
    if (quiet) window.scrollTo(0, scrollY);
    const jump = () => { const el = document.getElementById('pf-' + sh.currentPid); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    const gn = $('#gonow'); if (gn) gn.addEventListener('click', jump);
    // 무대에서 순서가 넘어가면, 심사위원이 잠시(8초) 손대지 않은 상태일 때 지금 연주자 쪽으로 화면을 옮겨 줌
    if (!quiet) lastCurrent = '';
    if (sh.currentPid && sh.currentPid !== lastCurrent && (!quiet || Date.now() - lastTouch > 8000)) setTimeout(jump, quiet ? 0 : 200);
    lastCurrent = sh.currentPid;
    $('#bk').addEventListener('click', home);
    $('#rf').addEventListener('click', () => openSheet(CUR).then(() => toast('최신 순서로 불러왔어요')));
    const cm = $('#cmt'); if (cm) cm.addEventListener('change', () => { showComments = cm.checked; renderSheet(true); });
    $$('.pf').forEach(el => {
      const r = sh.list[+el.dataset.i];
      $$('[data-v]', el).forEach(b => b.addEventListener('click', () => save(el, r, { value: b.dataset.v })));
      const ta = $('[data-c]', el);
      if (ta) ta.addEventListener('change', () => save(el, r, { comment: ta.value, value: r.value }));
    });
    const sb = $('#sub'); if (sb) sb.addEventListener('click', submit);
  }

  function save(el, r, patch) {
    const st = $('[data-st]', el);
    const prev = r.value;
    if ('value' in patch) r.value = patch.value;
    if ('comment' in patch) r.comment = patch.comment;
    $$('[data-v]', el).forEach(b => b.classList.toggle('on', b.dataset.v === r.value));
    el.classList.toggle('done', r.value !== '');
    if (st) { st.className = 'st'; st.textContent = '저장 중…'; }
    pending++;
    const params = { sessionId: CUR, pid: r.pid, value: r.value };
    if ('comment' in patch) params.comment = r.comment;
    api('score', params, 'judge').then(res => {
      if (st) st.textContent = '저장됨 ' + String(res.at).slice(11, 16);
      updateFoot();
    }).catch(e => {
      r.value = prev;
      $$('[data-v]', el).forEach(b => b.classList.toggle('on', b.dataset.v === r.value));
      if (st) { st.className = 'st err'; st.textContent = '저장 안 됨 — 다시 눌러 주세요'; }
      onErr(e);
    }).finally(() => { pending--; });
  }
  function updateFoot() {
    const sh = SHEET, need = sh.list.filter(r => !r.absent).length, done = sh.list.filter(r => !r.absent && r.value !== '').length;
    const b = $('.foot b'); if (b) b.textContent = done;
  }
  function submit() {
    const sh = SHEET;
    const left = sh.list.filter(r => !r.absent && r.value === '');
    if (left.length) { toast('아직 채점하지 않은 연주자가 ' + left.length + '명 있어요: ' + left.map(r => r.perfOrder != null ? r.perfOrder + '번' : '순번 ' + r.seq).join(', '), 'bad'); return; }
    let sum = '';
    if (sh.mode === 'ox') { const o = sh.list.filter(r => r.value === '1').length; sum = '○ ' + o + '명 · ✕ ' + sh.list.filter(r => r.value === '0').length + '명'; }
    else { const c = {}; sh.list.forEach(r => { if (r.value) c[r.value] = (c[r.value] || 0) + 1; }); sum = Object.keys(c).sort().map(k => k + '등위 ' + c[k] + '명').join(' · '); }
    confirmBox('이 채점표를 제출할까요?\n' + sum + '\n\n제출 후에는 직접 수정할 수 없어요.', '제출하기').then(ok => {
      if (!ok) return;
      const b = $('#sub'); busy(b, true);
      api('submitSheet', { sessionId: CUR }, 'judge').then(() => { toast('제출했어요. 감사합니다.', 'ok'); openSheet(CUR); }).catch(e => { busy(b, false); onErr(e); });
    });
  }

  if (App.getToken('judge')) home(); else needLogin();
}
</script>
</body>
</html>
